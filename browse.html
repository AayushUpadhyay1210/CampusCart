<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse — CampusCart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="toast"></div>

  
  <nav id="navAuth"></nav>

  
  <section>
    <div class="container">

      <div class="browse-header">
        <h1 class="browse-title">Browse listings</h1>
        <p class="text-muted" style="margin-top:0.3rem">Find great deals from students on your campus</p>
      </div>

      
      
      <div class="filters">

        
        <input class="search-bar"
               type="text"
               id="searchInput"
               placeholder="Search items..."
               oninput="filterListings()">

        
        <select class="filter-select" id="catFilter" onchange="filterListings()">
          <option value="">All categories</option>
          <option value="Books">Books</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Furniture">Furniture</option>
          <option value="Sports">Sports</option>
          <option value="Other">Other</option>
        </select>

        
        <select class="filter-select" id="priceFilter" onchange="filterListings()">
          <option value="">Any price</option>
          <option value="0-500">Under Rs. 500</option>
          <option value="500-2000">Rs. 500 to Rs. 2,000</option>
          <option value="2000-10000">Rs. 2,000 to Rs. 10,000</option>
          <option value="10000plus">Rs. 10,000+</option>
        </select>

      </div>

      <div class="results-count" id="resultsCount"></div>

      
      <div class="grid-3" id="listingsGrid">
        <p class="text-muted">Loading listings...</p>
      </div>

    </div>
  </section>

  
  <footer>
    <div class="container">
      <p>CampusCart &copy; 2026</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/post.js"></script>
  <script src="js/browse.js"></script>
  <script>
    window.addEventListener("load", function() {
      initBrowse();
    });
  </script>

</body>
</html>
